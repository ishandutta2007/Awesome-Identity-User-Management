<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.55; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseBeam {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.2; }
      50% { stroke-dashoffset: 40; opacity: 0.6; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; r: 3; }
      50% { opacity: 0.9; r: 5; }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 250px; }
    .pill1 { animation: floatPill 5s ease-in-out infinite; }
    .pill2 { animation: floatPill 6s ease-in-out 1s infinite; }
    .pill3 { animation: floatPill 5.5s ease-in-out 2s infinite; }
    .pill4 { animation: floatPill 6.5s ease-in-out 0.5s infinite; }
    .beam { stroke-dasharray: 8 6; animation: pulseBeam 12s linear infinite; }
    .node1 { animation: nodeBlink 3s ease-in-out infinite; }
    .node2 { animation: nodeBlink 4s ease-in-out 1s infinite; }
    .node3 { animation: nodeBlink 3.5s ease-in-out 2s infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic / Animated Ambient Orbs in Background -->
  <circle class="orb1" cx="220" cy="90" r="140" fill="url(#glowGrad1)" filter="url(#glow)" />
  <circle class="orb2" cx="980" cy="240" r="160" fill="url(#glowGrad2)" filter="url(#glow)" />

  <!-- Dynamic Circuit / Network Connectors (IAM Topology) in Background -->
  <g stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.4">
    <path class="beam" d="M 80,60 L 260,60 L 320,110 L 880,110 L 940,60 L 1120,60" />
    <path class="beam" d="M 120,300 L 280,300 L 340,250 L 860,250 L 920,300 L 1080,300" />
    <path class="beam" d="M 600,30 L 600,100" />
    <path class="beam" d="M 600,260 L 600,330" />
  </g>

  <!-- Dynamic Glowing Nodes -->
  <circle class="node1" cx="320" cy="110" r="4" fill="#38bdf8" />
  <circle class="node2" cx="880" cy="110" r="4" fill="#a855f7" />
  <circle class="node3" cx="340" cy="250" r="4" fill="#818cf8" />
  <circle class="node1" cx="860" cy="250" r="4" fill="#38bdf8" />

  <!-- Dynamic Floating Decorative Tags / Badges (Offset to sides to keep center crystal clear) -->
  <g class="pill1">
    <rect x="75" y="145" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="92" cy="161" r="5" fill="#38bdf8" />
    <text x="106" y="166" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">OIDC &amp; SAML</text>
  </g>

  <g class="pill2">
    <rect x="65" y="195" width="145" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="82" cy="211" r="5" fill="#818cf8" />
    <text x="96" y="216" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero Trust / MFA</text>
  </g>

  <g class="pill3">
    <rect x="990" y="145" width="140" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="1007" cy="161" r="5" fill="#a855f7" />
    <text x="1021" y="166" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SCIM Directory</text>
  </g>

  <g class="pill4">
    <rect x="980" y="195" width="155" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="997" cy="211" r="5" fill="#ec4899" />
    <text x="1011" y="216" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Passkeys &amp; FIDO2</text>
  </g>

  <!-- Foreground Content: Unobstructed & Ultra-Crisp -->
  <g text-anchor="middle">
    <!-- Top Pill Category Header -->
    <rect x="475" y="45" width="250" height="28" rx="14" fill="url(#badgeGrad)" opacity="0.9" />
    <text x="600" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">IDENTITY &amp; ACCESS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Identity &amp; User Management</text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">A Curated Guide to Enterprise SaaS Platforms &amp; Modern Open-Source IdPs</text>

    <!-- Subtitle 2: Focus Areas -->
    <text x="600" y="218" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Authentication • Authorization • Single Sign-On (SSO) • Passkeys • Self-Hosted Infrastructure</text>

    <!-- Bottom Metrics Pill -->
    <rect x="420" y="260" width="360" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="600" y="283" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Production Ready • Battle-Tested • Community Curated</text>
  </g>
</svg>
